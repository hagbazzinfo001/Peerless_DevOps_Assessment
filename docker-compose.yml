version: "3.9"

services:
  backend:
    build:
      context: ./backend
    container_name: peerless-backend
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      APP_VERSION: 1.0.0
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: peerless-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped