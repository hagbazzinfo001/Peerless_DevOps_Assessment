services:
  backend:
    image: ghcr.io/hagbazzinfo001/peerless-backend:latest
    expose:
      - "5000"

  frontend:
    image: ghcr.io/hagbazzinfo001/peerless-frontend:latest
    expose:
      - "80"

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend