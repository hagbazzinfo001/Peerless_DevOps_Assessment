name: Peerless DevOps CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Build Metadata
        run: |
          echo "BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_ENV
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      ########################
      # Backend
      ########################

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Run Backend Tests
        working-directory: backend
        run: npm test --if-present

      ########################
      # Frontend
      ########################

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend
        working-directory: frontend
        run: npm run build

      ########################
      # Login to GHCR
      ########################

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      ########################
      # Backend Image
      ########################

      - name: Build Backend Image
        run: |
          docker build \
            --build-arg APP_VERSION=$SHORT_SHA \
            --build-arg BUILD_DATE="$BUILD_DATE" \
            -t ghcr.io/$IMAGE_OWNER/peerless-backend:latest \
            -t ghcr.io/$IMAGE_OWNER/peerless-backend:$SHORT_SHA \
            ./backend

      - name: Push Backend Images
        run: |
          docker push ghcr.io/$IMAGE_OWNER/peerless-backend:latest
          docker push ghcr.io/$IMAGE_OWNER/peerless-backend:$SHORT_SHA

      ########################
      # Frontend Image
      ########################

      - name: Build Frontend Image
        run: |
          docker build \
            --build-arg APP_VERSION=$SHORT_SHA \
            --build-arg BUILD_DATE="$BUILD_DATE" \
            -t ghcr.io/$IMAGE_OWNER/peerless-frontend:latest \
            -t ghcr.io/$IMAGE_OWNER/peerless-frontend:$SHORT_SHA \
            ./frontend

      - name: Push Frontend Images
        run: |
          docker push ghcr.io/$IMAGE_OWNER/peerless-frontend:latest
          docker push ghcr.io/$IMAGE_OWNER/peerless-frontend:$SHORT_SHA

      - name: Build Summary
        run: |
          echo "✅ CI completed successfully"
          echo "Version: $SHORT_SHA"
          echo "Build Date: $BUILD_DATE"