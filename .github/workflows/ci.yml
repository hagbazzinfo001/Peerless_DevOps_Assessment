name: Peerless DevOps CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-test:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      ##################################
      # Backend
      ##################################

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Run Backend Tests
        working-directory: backend
        run: npm test --if-present

      ##################################
      # Frontend
      ##################################

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend
        working-directory: frontend
        run: npm run build

      ##################################
      # Login to GHCR
      ##################################

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      ##################################
      # Backend Image
      ##################################

      - name: Build Backend Image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/peerless-backend:latest \
            ./backend

      - name: Push Backend Image
        run: |
          docker push \
            ghcr.io/${{ github.repository_owner }}/peerless-backend:latest

      ##################################
      # Frontend Image
      ##################################

      - name: Build Frontend Image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/peerless-frontend:latest \
            ./frontend

      - name: Push Frontend Image
        run: |
          docker push \
            ghcr.io/${{ github.repository_owner }}/peerless-frontend:latest

      - name: Finished
        run: echo "CI completed successfully."